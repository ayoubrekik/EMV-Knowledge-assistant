<!DOCTYPE html>
<html lang="en">
<script>
  const token = sessionStorage.getItem("access_token");
  const user = JSON.parse(sessionStorage.getItem("user") || "{}");
  console.log(user)
  if (token) {
    if (user.role == "user") {
      window.location.replace("/user");
    } else if (user.role == "admin") {
      window.location.replace("/admin");
    }
  }

</script>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | EMV AI Assistant</title>

  <link rel="icon" type="image/png" href="{{ url_for('static', path='img/icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/login.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>
  <main class="login-page">

    <form class="login-card" id="loginForm">

      <div class="logos-row">
        <div class="brand">
          <img src="{{ url_for('static', path='img/icon.png') }}" alt="EMV AI Logo">

          <div>
            <h1>EMV AI</h1>
            <p>Knowledge Assistant</p>
          </div>
        </div>

        <img class="telnet-logo" src="{{ url_for('static', path='img/Logo_Telnet.png') }}" alt="Telnet Logo">
      </div>

      <div class="form-header">
        <h2>Welcome back</h2>
        <p>Login to continue to your assistant</p>
      </div>

      <div class="input-group">
        <label for="username">Username</label>
        <div class="input-box">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="username" name="username" placeholder="Enter your username" required>
        </div>
      </div>

      <div class="input-group">
        <label for="password">Password</label>

        <div class="input-box">
          <i class="fa-solid fa-lock"></i>

          <input type="password" id="password" name="password" placeholder="Enter your password" required>

          <i class="fa-regular fa-eye password-toggle" id="togglePassword"></i>
        </div>
      </div>
      <div class="form-options">
        <label>
          <input type="checkbox" name="remember">
          Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="login-btn">
        Login
        <i class="fa-solid fa-arrow-right"></i>
      </button>

      <p class="register-text">
        Don’t have an account?
        <a href="/register">Create account</a>
      </p>

    </form>

  </main>

 <script>
  const loginForm = document.getElementById("loginForm");

  const passwordInput = document.getElementById("password");
  const togglePassword = document.getElementById("togglePassword");

  togglePassword.addEventListener("click", () => {
    if (passwordInput.type === "password") {
      passwordInput.type = "text";

      togglePassword.classList.remove("fa-eye");
      togglePassword.classList.add("fa-eye-slash");
    } else {
      passwordInput.type = "password";

      togglePassword.classList.remove("fa-eye-slash");
      togglePassword.classList.add("fa-eye");
    }
  });

  loginForm.addEventListener("submit", async function (e) {
    e.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    const formData = new URLSearchParams();
    formData.append("username", username);
    formData.append("password", password);

    try {
      const response = await fetch("/auth/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded",
        },
        body: formData,
      });

      const data = await response.json();

      if (!response.ok) {
        alert(data.detail || "Login failed");
        return;
      }

      sessionStorage.setItem("access_token", data.access_token);
      sessionStorage.setItem("user", JSON.stringify(data.user));

      if (data.user.role === "admin") {
        window.location.href = "/admin";
      } else if (data.user.role === "user") {
        window.location.href = "/user";
      } else {
        window.location.href = "/";
      }

    } catch (error) {
      console.error(error);
      alert("Something went wrong");
    }
  });
</script>
</body>

</html>
