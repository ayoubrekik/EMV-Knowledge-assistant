version: "3.9"

services:
  ai-agent:
    build: .
    container_name: ai_agent
    volumes:
      - .:/app
      - ./data:/app/data
      - ./models/huggingface:/root/.cache/huggingface
      - ./models/torch:/root/.cache/torch
      - ./models/ollama:/root/.ollama
    ports:
      - "8888:8888"
    tty: true
    stdin_open: true
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root
