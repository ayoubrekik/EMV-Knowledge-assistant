version: "3.9"


services:

  api:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./src/storage/models:/root/.cache/huggingface
      - ./scripts:/app/scripts
      - ./templates:/app/templates
      - ./tests:/app/tests
      - ./static:/app/static


    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      - chroma
      - ollama
  # EDA + testing (Jupyter)
  notebook:
    build: .
    command: >
      jupyter notebook
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --notebook-dir=/app/src/core/notebooks
      --NotebookApp.token=''
      --NotebookApp.password=''
    ports:
      - "8888:8888"
    volumes:
      - ./src:/app/src
      - ./src/storage/models:/root/.cache/huggingface
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./static:/app/static
      - ./templates:/app/templates
  
    env_file:
      - .env
    depends_on:
      - chroma
      - ollama


  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - ./src/storage/chroma:/data
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: emv_knowledge
      POSTGRES_USER: user
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - ./src/storage/postgres:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ./src/storage/models/ollama:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
